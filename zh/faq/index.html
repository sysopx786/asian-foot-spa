rc="https://grok.com/grok-app-builder/extensions.js" defer></script></head><body><!--$--><a class="skip" href="#content">跳到正文</a><header class="site-header no-print"><div class="header-main wrap"><a class="logo-home active" href="/asian-foot-spa/zh" data-status="active" aria-current="page"><img class="logo-wordmark" src="/asian-foot-spa/logo-header.jpg" alt="Asian Foot Spa" width="3190" height="272"/></a><nav class="hidden items-center gap-1 lg:flex" aria-label="Primary"><button type="button" class="btn" aria-expanded="false">服务</button><button type="button" class="btn" aria-expanded="false">工作室</button><a class="btn" href="/asian-foot-spa/zh/reviews">评价</a><a class="btn active" href="/asian-foot-spa/zh/faq" data-status="active" aria-current="page">问答</a><a class="btn btn-line" href="/asian-foot-spa/zh/visit">到店</a></nav><div class="header-tools"><nav class="lang-switch" aria-label="语言"><a href="/asian-foot-spa/faq">EN</a><a href="/asian-foot-spa/es/faq">ES</a><span aria-current="page">中文</span></nav><button class="btn" type="button" aria-label="搜索"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search size-4" aria-hidden="true"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg></button><button class="btn btn-line lg:hidden" type="button" aria-expanded="false"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-menu size-4" aria-hidden="true"><path d="M4 12h16"></path><path d="M4 18h16"></path><path d="M4 6h16"></path></svg><span class="sr-only">菜单</span></button></div></div></header><main id="content"><script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"工作室在哪里？","acceptedAnswer":{"@type":"Answer","text":"245 Schuylkill Road, Phoenixville, PA 19460。245 写在门边的玻璃上，在写着 Asian Foot Spa 的灯箱招牌下面。门上的电话是 (215) 433-6969。"}},{"@type":"Question","name":"什么时候营业？","acceptedAnswer":{"@type":"Answer","text":"门上写着 Open 7 Days, 10am–9pm。也就是每天上午 10:00 到晚上 9:00。如果接近晚上结束时才到，请先打电话。"}},{"@type":"Question","name":"需要预约吗？","acceptedAnswer":{"@type":"Answer","text":"打 (215) 433-6969。房间空着时，有时可以接受没有预约的客人，但如果你只是直接上门，工作室不能保证有空。请说明要足部，还是床上的身体手法。"}},{"@type":"Question","name":"里面有什么？","acceptedAnswer":{"@type":"Answer","text":"等候室、一张按摩床，一把足部椅。"}},{"@type":"Question","name":"足底反射做什么？","acceptedAnswer":{"@type":"Answer","text":"技师按足底、足弓、足跟和脚趾上已标出的点。这是足部的手法，不是全身按摩，也不诊断疾病。时间和价格在菜单上。"}},{"@type":"Question","name":"瑞典式、深层组织按摩和指压有什么不同？","acceptedAnswer":{"@type":"Answer","text":"瑞典式是用油的按摩，滑动和揉捏，压力轻到中等。深层组织是更慢地按入较深的肌肉，做在具体紧绷的部位。指压是沿经络的日本指压，通常穿着衣服，不用油。要哪一种，请说。时间和价格在菜单上。"}},{"@type":"Question","name":"热石做什么？","acceptedAnswer":{"@type":"Answer","text":"加热的石头放在身上，或握在手里，让肌肉变暖。应当是温的，不是烫的。可以拒绝。包含哪些，在菜单上。"}},{"@type":"Question","name":"泰式按摩做什么？","acceptedAnswer":{"@type":"Answer","text":"泰式按摩是沿 sen 线的按压，加上辅助拉伸。肢体被移动并保持。通常穿宽松衣服，不用油。菜单卡上没有这一项。请打电话问是否提供。"}},{"@type":"Question","name":"情侣按摩是什么？","acceptedAnswer":{"@type":"Answer","text":"两个人在同一次预约里接受按摩。每个人都有一次按摩。它在菜单上。请打电话问如何安排座位。"}},{"@type":"Question","name":"拔罐做什么？","acceptedAnswer":{"@type":"Answer","text":"罐子放在皮肤上，用吸力把组织吸起来，然后取下。这不是滑动的按摩手法。痕迹可能留几天。拔罐在菜单上。"}},{"@type":"Question","name":"一次多少钱？","acceptedAnswer":{"@type":"Answer","text":"价格在菜单上。网站其他地方不再写一遍。"}},{"@type":"Question","name":"穿什么？","acceptedAnswer":{"@type":"Answer","text":"足底反射穿日常衣服即可，脱掉鞋袜。瑞典式或深层组织，按舒适程度更衣，并留在盖布下。指压或泰式，穿方便活动的衣服。"}},{"@type":"Question","name":"怎么付款？","acceptedAnswer":{"@type":"Answer","text":"付款写在菜单上。卡片要求信用卡或借记卡，没有提到现金。接受信用卡、借记卡和 NFC 移动支付。"}},{"@type":"Question","name":"这是医疗吗？","acceptedAnswer":{"@type":"Answer","text":"不是。足底反射、瑞典式、深层组织、指压、泰式、热石、芳香疗法和拔罐都是身体手法，不是诊断，也不能代替临床医师。请说明怀孕、血栓、近期手术、皮肤问题，以及技师不应当按或加热的地方。"}},{"@type":"Question","name":"这些照片是工作室的吗？","acceptedAnswer":{"@type":"Answer","text":"是。是 Phoenixville 工作室。"}}]}</script><nav class="wrap pt-8 text-sm text-muted" aria-label="Breadcrumb"><ol class="flex flex-wrap items-center gap-2"><li><a class="text-link active" href="/asian-foot-spa/zh" data-status="active" aria-current="page">首页</a></li><li class="flex items-center gap-2"><span aria-hidden="true">/</span><a class="text-link active" href="/asian-foot-spa/zh/faq" data-status="active" aria-current="page">问答</a></li></ol></nav><header class="wrap pt-8 pb-6"><h1 class="font-display text-5xl">值得直接回答的问题</h1></header><div class="wrap pb-16"><section class="mt-8" aria-labelledby="group-visit"><h2 id="group-visit" class="font-display text-3xl">到店</h2><div class="mt-2" data-orientation="vertical"><div data-state="closed" data-orientation="vertical" id="where" class="scroll-mt-28"><h3 data-orientation="vertical" data-state="closed"><button type="button" aria-expanded="false" data-state="closed" data-orientation="vertical" id="radix-_R_1j4d6_" class="faq-trigger group" data-radix-collection-item="">工作室在哪里？<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down size-5 shrink-0" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button></h3><div data-state="closed" id="radix-_R_9j4d6_" hidden="" role="region" aria-labelledby="radix-_R_1j4d6_" data-orientation="vertical" class="faq-panel" style="--radix-accordion-content-height:var(--radix-collapsible-content-height);--radix-accordion-content-width:var(--radix-collapsible-content-width)"></div></div><div data-state="closed" data-orientation="vertical" id="hours" class="scroll-mt-28"><h3 data-orientation="vertical" data-state="closed"><button type="button" aria-expanded="false" data-state="closed" data-orientation="vertical" id="radix-_R_2j4d6_" class="faq-trigger group" data-radix-collection-item="">什么
