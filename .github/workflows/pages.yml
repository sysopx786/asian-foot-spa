name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          GITHUB_PAGES: "1"
      - name: Collect static output
        run: |
          mkdir -p site
          if [ -d .vercel/output/static ]; then cp -a .vercel/output/static/. site/; fi
          if [ -d dist/client ]; then cp -a dist/client/. site/; elif [ -d dist ]; then cp -a dist/. site/; fi
          mkdir -p site/media
          cp -a public/media/. site/media/
          cp -a public/logo-header.jpg public/favicon.svg public/og.jpg public/logo-wordmark.svg site/ 2>/dev/null || true
          find site -maxdepth 2 -type d -print
          test -f site/media/studio-walkthrough.mp4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
