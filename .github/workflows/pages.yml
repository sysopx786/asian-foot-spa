name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          GITHUB_PAGES: "1"
      - name: Prerender pages
        run: |
          set -euo pipefail
          server=.output/server/index.mjs
          echo "server=$server"
          ls -l "$server"
          PORT=3000 node "$server" > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/asian-foot-spa/ || curl -sf -o /dev/null http://127.0.0.1:3000/; then
              break
            fi
            sleep 1
          done
          base=""
          if curl -sf -o /dev/null http://127.0.0.1:3000/asian-foot-spa/; then base="/asian-foot-spa"; fi
          mkdir -p site
          if [ -d .output/public ]; then cp -a .output/public/. site/; fi
          if [ -d .vercel/output/static ]; then cp -a .vercel/output/static/. site/; fi
          mkdir -p site/media
          cp -a public/media/. site/media/
          cp -a public/logo-header.jpg public/favicon.svg public/og.jpg public/logo-wordmark.svg site/ 2>/dev/null || true
          routes="/ /es /gallery /reviews /faq /visit /privacy /locations /locations/phoenixville /services /services/reflexology /services/swedish /services/deep-tissue /services/shiatsu /services/thai /services/hot-stone /services/aromatherapy /services/couples /services/cupping /es/gallery /es/reviews /es/faq /es/visit /es/privacy /es/locations /es/locations/phoenixville /es/services"
          for route in $routes; do
            dest="site${route}/index.html"
            mkdir -p "$(dirname "$dest")"
            code=$(curl -s -o "$dest" -w '%{http_code}' "http://127.0.0.1:3000${base}${route}")
            echo "$code $route"
            if [ "$code" != "200" ]; then rm -f "$dest"; fi
          done
          if [ ! -s site/index.html ]; then echo '--- server log ---'; cat /tmp/server.log; exit 1; fi
          grep -q studio-walkthrough site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
