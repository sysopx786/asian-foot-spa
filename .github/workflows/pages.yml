name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          GITHUB_PAGES: "1"
      - name: Prerender pages
        run: |
          set -euo pipefail
          server=.output/server/index.mjs
          echo "server=$server"
          ls -l "$server"
          PORT=3000 node "$server" > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/asian-foot-spa/ || curl -sf -o /dev/null http://127.0.0.1:3000/; then
              break
            fi
            sleep 1
          done
          base=""
          if curl -sf -o /dev/null http://127.0.0.1:3000/asian-foot-spa/; then base="/asian-foot-spa"; fi
          mkdir -p site
          if [ -d .output/public ]; then cp -a .output/public/. site/; fi
          if [ -d .vercel/output/static ]; then cp -a .vercel/output/static/. site/; fi
          mkdir -p site/media
          cp -a public/media/. site/media/
          cp -a public/logo-header.jpg public/favicon.svg public/og.jpg public/logo-wordmark.svg site/ 2>/dev/null || true
          services="reflexology swedish deep-tissue shiatsu thai hot-stone aromatherapy couples cupping"
          routes="/ /gallery /reviews /faq /visit /privacy /locations /locations/phoenixville /services"
          for s in $services; do routes="$routes /services/$s"; done
          for lang in es zh; do
            routes="$routes /$lang /$lang/gallery /$lang/reviews /$lang/faq /$lang/visit /$lang/privacy /$lang/locations /$lang/locations/phoenixville /$lang/services"
            for s in $services; do routes="$routes /$lang/services/$s"; done
          done
          missing=0
          for route in $routes; do
            dest="site${route}/index.html"
            mkdir -p "$(dirname "$dest")"
            code=$(curl -s -o "$dest" -w '%{http_code}' "http://127.0.0.1:3000${base}${route}")
            echo "$code $route"
            if [ "$code" != "200" ] || [ ! -s "$dest" ]; then
              echo "missing $route"
              missing=1
            fi
          done
          curl -fsS "http://127.0.0.1:3000${base}/sitemap.xml" -o site/sitemap.xml
          curl -fsS "http://127.0.0.1:3000${base}/robots.txt" -o site/robots.txt
          python3 - << 'PY'
from pathlib import Path
public = "https://sysopx786.github.io/asian-foot-spa"
sitemap = Path("site/sitemap.xml").read_text()
import re
sitemap = re.sub(r"https?://(?:127\.0\.0\.1|localhost)(?::\d+)?(?:/asian-foot-spa)?", public, sitemap)
Path("site/sitemap.xml").write_text(sitemap)
robots = Path("site/robots.txt").read_text()
robots = re.sub(r"Sitemap:.*", f"Sitemap: {public}/sitemap.xml", robots)
Path("site/robots.txt").write_text(robots)
if public not in sitemap:
    raise SystemExit("sitemap was not rewritten to the public site")
print("sitemap", sitemap.count("<loc>"), "urls")
PY
          if [ "$missing" != "0" ]; then echo '--- server log ---'; cat /tmp/server.log; exit 1; fi
          grep -q studio-walkthrough site/index.html
          find site -name '*.html' -print0 | xargs -0 sed -i \
            -e 's#src="/logo-header.jpg"#src="/asian-foot-spa/logo-header.jpg"#g' \
            -e 's#src="/media/#src="/asian-foot-spa/media/#g' \
            -e 's#href="/favicon.svg"#href="/asian-foot-spa/favicon.svg"#g' \
            -e 's#href="/og.jpg"#href="/asian-foot-spa/og.jpg"#g'
          grep -q '/asian-foot-spa/logo-header.jpg' site/index.html
          if grep -R --include='*.html' --include='*.js' -n '"/media/' site; then
            echo "photo URLs are missing the /asian-foot-spa prefix"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
